name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # roda todo dia à meia-noite (UTC)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Card de estatísticas gerais (equivalente ao "GitHub Stats" antigo)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: stats.svg
          theme: dark
          base: "header, activity, community, repositories"

      # Card de linguagens mais usadas (equivalente ao "Top Langs" antigo)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: langs.svg
          theme: dark
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_details: percentage
          plugin_languages_limit: 6
